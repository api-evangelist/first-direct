profile: FAPI (Financial-grade API) — UK Open Banking / OBIE Read/Write security profile
notes: >-
  The OpenAPI securitySchemes declare only the oauth2 flows (placeholder authserver.example
  URLs are the OBIE standard's examples). The real first direct / HSBC UK production model is
  FAPI-secured and adds, beyond OAuth2/OIDC: mutual-TLS client authentication with
  OBIE/eIDAS transport certificates, detached JWS request signing (x-jws-signature), and
  PSD2 strong customer authentication (SCA) for the PSU authorization-code flow. Access
  requires FCA authorisation as an AISP/PISP/CBPII and directory registration. The public
  Open Data API requires no authentication.
mechanisms:
- oauth2 (TPP client_credentials + PSU authorization_code)
- openIdConnect
- mutualTLS (OBIE/eIDAS transport certificates)
- request-signing (detached JWS, x-jws-signature)
- psd2-sca
