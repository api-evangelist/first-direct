aid: first-direct
url: https://raw.githubusercontent.com/api-evangelist/first-direct/refs/heads/main/apis.yml
name: first direct
kind: company
description: first direct is a telephone- and internet-based retail bank and a division
  of HSBC UK Bank plc, headquartered in Leeds, England and launched in 1989. It offers
  personal current accounts, savings, credit cards, loans, mortgages and insurance to
  UK consumers with a reputation for customer service, operating with no physical
  branches of its own. As an HSBC brand, first direct participates in the UK Open Banking
  regime under HSBC UK - one of the nine CMA9 banks mandated by the Competition and
  Markets Authority - and is regulated by the Financial Conduct Authority (FCA) and
  Prudential Regulation Authority (PRA). Its Open Banking surfaces conform to the Open
  Banking Implementation Entity (OBIE / Open Banking Limited) standards - a public,
  unauthenticated Open Data API (personal current account product reference data, ATM
  and branch locators, published on the shared HSBC api.hsbc.com host where "first
  direct" appears as a distinct brand) and the FAPI-secured OBIE Read/Write APIs -
  Account and Transaction Information (AIS), Payment Initiation (PIS) and Confirmation
  of Funds (CBPII) - onboarded and documented through HSBC's developer portal at
  develop.hsbc.com, which serves the HSBC UK, first direct and M&S Bank brands.
