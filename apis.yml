- aid: first-direct:first-direct-account-information-api
  name: first direct Account and Transaction Information API (AIS)
  description: OBIE Read/Write Account and Transaction Information (AIS) API for first
    direct accounts, exposed through HSBC's developer platform. FAPI-secured with
    OAuth2/OIDC, mutual-TLS client authentication and PSD2 strong customer
    authentication; requires FCA/TPP onboarding and OBIE/eIDAS certificates. OpenAPI
    pointer is the shared OBIE Read/Write standard the bank conforms to, not a
    first-direct-proprietary contract.
  humanURL: https://develop.hsbc.com/
