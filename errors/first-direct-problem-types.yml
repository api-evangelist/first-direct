- {status: 422, title: Unprocessable Entity, schema: OBErrorResponse1, meaning: Semantically invalid request the ASPSP cannot process (business-rule failure).}
- {status: 429, title: Too Many Requests, schema: OBErrorResponse1, meaning: Per-TPP rate limit exceeded; retry after backoff.}
